# 论文翻译工具配置模板
# 复制为 config.yaml 后填写；config.yaml 已被 .gitignore 忽略

# ---- MinerU 档位 ----
tier: basic                # basic(CPU小模型) | standard(小模型+VLM) | flash(快读)

# ---- API 提供方（OpenAI 兼容协议，三选一或自行扩展）----
# 到 M3/M4 阶段需要 key 时再填
api:
  provider: siliconflow    # siliconflow | bigmodel | custom
  base_url: https://api.siliconflow.cn/v1
  api_key: ""              # 待填：控制台「API keys」页生成
  zhipu_api_key: ""        # 选填：填了之后 run.bat 可启用 free 免费模式（智谱 GLM-4.6V/4.7-Flash）
  # 图表理解多模态模型（实测口径）。注意：请求会附带 enable_thinking:false，
  # 仅 Qwen3-VL 密集(dense)系列支持，MoE 变体如 Qwen/Qwen3-VL-30B-A3B-Instruct
  # 会直接报「不支持参数 'enable_thinking'」；Qwen2.5-VL 系列硅基流动已下架
  vlm_model: "Qwen/Qwen3-VL-32B-Instruct"
  # 翻译文本模型（M4 选型实测确认；DeepSeek 系列兼容 enable_thinking 参数）
  llm_model: "deepseek-ai/DeepSeek-V4.1-Flash"
  # 代理策略：留空=强制直连（推荐，国内端点不受 VPN 开关影响）
  # "env"=跟随系统环境变量；或填代理 URL 如 http://127.0.0.1:7897
  proxy: ""
  max_concurrency: 4
  budget_limit_usd: 1.0    # 单篇成本上限，超过暂停

# ---- 免费方案（智谱，全免费，选填）----
# 在 api.zhipu_api_key 填入智谱 key 后，run.bat 启动时可选 free 模式启用：
#   VLM = GLM-4.6V-Flash（图表理解），LLM = GLM-4.7-Flash（翻译）
free:
  base_url: https://open.bigmodel.cn/api/paas/v4
  vlm_model: GLM-4.6V-Flash
  llm_model: GLM-4.7-Flash

# ---- 本地方案（Ollama，本地 GPU，选填）----
# 启用：run.bat 菜单选 3) local，或 CLI 加 --mode local。
# 前提：本机已装 Ollama 并导入翻译模型（如 gemma3-4b-it Q4_K_M GGUF）。
# 可选：vlm_model 填 Ollama 多模态模型（实测 MiniCPM-V 2.6 q4_K_M，GGUF 主模型+mmproj
#       从 ModelScope OpenBMB/MiniCPM-V-2_6-gguf 下载导入），解锁本地 S3 图表理解。
#       6GB 显存下 VLM 与翻译模型不能常驻，流水线串行执行（S3 跑完自动卸载再进 S4）。
# 未配置 vlm_model 时 local 模式跳过 S3（figures/ 仅含裁剪图与图注）。
local:
  base_url: http://localhost:11434/v1     # Ollama OpenAI 兼容端点
  api_key: "ollama"                        # 占位，Ollama 不校验
  llm_model: "gemma4b"                     # 本地翻译模型（需先导入 Ollama；RTX4050 6GB 实测三选一：gemma4b 质量/ qwen3b 均衡/ qwen15b 最快）
  vlm_model: ""                            # 本地图表理解模型（如 minicpmv26；留空=跳过 S3）
  max_concurrency: 1                       # 本地显存有限，建议降并发

# ---- 输出 ----
output:
  bilingual: true          # 是否生成中英对照版
  lang_target: zh
